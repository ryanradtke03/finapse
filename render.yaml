# Render Blueprint for the Finapse public Sandbox demo.
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# It provisions three resources: a Postgres DB, the API web service, and the
# static frontend. A few env vars are `sync: false` because they either depend
# on the final service URLs (only known after the first deploy) or are secrets
# you paste in manually. After the first deploy, fill those in and redeploy.

databases:
  - name: finapse-db
    plan: free
    databaseName: finapse
    user: finapse

services:
  # ── API (Express) ────────────────────────────────────────────────────────
  - type: web
    name: finapse-api
    runtime: node
    plan: free
    # Monorepo: install at the root, then build/migrate/seed the api workspace.
    # --include=dev forces devDependencies (typescript, prisma, tsx, @types/*),
    # which Render otherwise skips because it sets NODE_ENV=production at build.
    buildCommand: >-
      npm install --include=dev &&
      npm run prisma:generate --workspace apps/api &&
      npm run build --workspace apps/api &&
      npm run db:deploy --workspace apps/api &&
      npm run db:seed --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finapse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # 64-char hex (32 bytes). Generate:
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ENCRYPTION_KEY
        sync: false
      # Plaid Sandbox credentials (dashboard.plaid.com) — paste manually.
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET_SANDBOX
        sync: false
      - key: PLAID_ENV
        value: sandbox
      # Demo posture: no real email, funnel through the seeded demo account.
      - key: EMAIL_PROVIDER
        value: console
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      # Number of proxy hops in front of this service, so per-IP rate limits
      # key on the real client IP rather than a proxy's.
      #
      # NOTE: the frontend now proxies /api/* to this service (see the rewrite
      # on finapse-web below), which adds a hop. If req.ip resolves to the
      # proxy's address, every visitor shares one rate-limit bucket and the
      # site 429s under normal traffic. Verify before trusting this value:
      #
      #   1. Add PROXY_DEBUG_TOKEN (any random string) to this service in the
      #      Render dashboard — `sync: false` keys are only prompted for on
      #      initial Blueprint creation, so it has to be added by hand.
      #   2. curl "https://<web-host>/api/v1/health/proxy?token=<that token>"
      #      from two different networks.
      #   3. If `resolvedIp` is identical across both, raise this to match
      #      `hopCount` from the response. If it differs, this value is right.
      #   4. Delete PROXY_DEBUG_TOKEN and the /health/proxy route afterwards.
      - key: TRUST_PROXY
        value: "1"
      # URL-coupled vars — set after the first deploy, once the URLs exist:
      #   CLIENT_ORIGIN / APP_URL  = the finapse-web URL (https://finapse-web.onrender.com)
      #   PLAID_WEBHOOK_URL        = https://finapse-api.onrender.com/api/v1/plaid/webhook
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false

  # ── Frontend (Vite static site) ──────────────────────────────────────────
  - type: web
    name: finapse-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    routes:
      # Proxy the API through the frontend's OWN origin so the `token` cookie is
      # first-party. finapse-web.onrender.com and finapse-api.onrender.com are
      # different *sites* — onrender.com is on the Public Suffix List, so they
      # are not sibling subdomains. Calling the API host directly makes `token`
      # a third-party cookie, which iOS Safari (and therefore every browser on
      # iOS) blocks outright. Symptom: login appears to succeed, then no data
      # loads and a refresh bounces to the landing page.
      #
      # Rules are matched in order, so this MUST come before the SPA fallback.
      - type: rewrite
        source: /api/*
        destination: https://finapse-api.onrender.com/api/*
      # SPA fallback so client routes (/dashboard, /transactions, …) resolve.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
      # Relative on purpose — requests go to the frontend's own origin and the
      # rewrite above forwards them to the API. Do NOT set this to the API's
      # absolute URL; that reintroduces the third-party-cookie breakage on iOS.
      - key: VITE_API_URL
        value: /api/v1
