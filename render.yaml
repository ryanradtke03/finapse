# Render Blueprint for the Finapse public Sandbox demo.
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# It provisions three resources: a Postgres DB, the API web service, and the
# static frontend. A few env vars are `sync: false` because they either depend
# on the final service URLs (only known after the first deploy) or are secrets
# you paste in manually. After the first deploy, fill those in and redeploy.

databases:
  - name: finapse-db
    plan: free
    databaseName: finapse
    user: finapse

services:
  # ── API (Express) ────────────────────────────────────────────────────────
  - type: web
    name: finapse-api
    runtime: node
    plan: free
    # Monorepo: install at the root, then build/migrate/seed the api workspace.
    buildCommand: >-
      npm install &&
      npm run prisma:generate --workspace apps/api &&
      npm run build --workspace apps/api &&
      npm run db:deploy --workspace apps/api &&
      npm run db:seed --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finapse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # 64-char hex (32 bytes). Generate:
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ENCRYPTION_KEY
        sync: false
      # Plaid Sandbox credentials (dashboard.plaid.com) — paste manually.
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET_SANDBOX
        sync: false
      - key: PLAID_ENV
        value: sandbox
      # Demo posture: no real email, funnel through the seeded demo account.
      - key: EMAIL_PROVIDER
        value: console
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      # Trust one proxy hop so per-IP rate limits key on the real client IP.
      - key: TRUST_PROXY
        value: "1"
      # URL-coupled vars — set after the first deploy, once the URLs exist:
      #   CLIENT_ORIGIN / APP_URL  = the finapse-web URL (https://finapse-web.onrender.com)
      #   PLAID_WEBHOOK_URL        = https://finapse-api.onrender.com/api/v1/plaid/webhook
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false

  # ── Frontend (Vite static site) ──────────────────────────────────────────
  - type: web
    name: finapse-web
    runtime: static
    buildCommand: npm install && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    # SPA fallback so client routes (/dashboard, /transactions, …) resolve.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
      # Full API base incl. the version prefix, e.g.
      # https://finapse-api.onrender.com/api/v1  — set after the API is up.
      - key: VITE_API_URL
        sync: false
