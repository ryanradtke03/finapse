services:
  postgres:
    image: postgres:16-alpine
    container_name: finapse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finapse
      POSTGRES_PASSWORD: finapse_password
      POSTGRES_DB: finapse_dev
    ports:
      - "5432:5432"
    volumes:
      - finapse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finapse -d finapse_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: finapse_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finapse_pgdata: